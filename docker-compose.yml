services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: deltascope
      MYSQL_USER: ${MYSQL_USER:-deltascope}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-deltascope_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 5051
      FLASK_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-deltascope}
      DB_PASSWORD: ${MYSQL_PASSWORD:-deltascope_local_password}
      DB_NAME: deltascope
      TOKEN_SECRET: ${TOKEN_SECRET:-local-development-token-secret-change-me}
      ADMIN_ACCOUNT: ${ADMIN_ACCOUNT:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-系统管理员}
      TEACHER_AUTH_CODE: ${TEACHER_AUTH_CODE:-gdutmath}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      MAX_CONTENT_LENGTH: 5242880
      MAX_UPLOAD_MB: 5
      UPLOADS_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-5051}:5051"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data:
